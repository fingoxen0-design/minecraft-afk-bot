name: Render Keep Alive

on:
  schedule:
    # Har 10 daqiqada Render ga tashqi HTTP so'rov yuborib turadi
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -f -m 20 "https://minecraft-afk-bot-y7ak.onrender.com/health" || echo "Ping failed or timed out"

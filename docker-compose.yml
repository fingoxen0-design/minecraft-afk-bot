version: '3.8'

services:
  mc-afk-bot:
    build: .
    container_name: mc_afk_bot
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./vote_state.json:/app/vote_state.json
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
